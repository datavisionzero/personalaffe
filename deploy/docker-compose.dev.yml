# Postgres for working on personalaffe, and nothing else:
# `dotnet run --project src/Personalaffe.Api` runs the server against it, with
# the connection string in appsettings.Development.json.
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# The published port is this product's own. planaffe, hostingaffe and logaffe
# are developed on the same machines and their development stacks publish
# theirs; two products that cannot be up at once would be a tax on every day of
# work, and the products are deliberately separate.
#
# This is the development database. The production topology — one application
# container, the file-storage volume, the reverse proxy — is PERSONAL-6's, and
# lands in deploy/docker-compose.yml beside this.

name: personalaffe-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: personalaffe
      POSTGRES_USER: personalaffe
      POSTGRES_PASSWORD: personalaffe
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "55732:5432"
    volumes:
      - personalaffe-dev-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personalaffe -d personalaffe"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  personalaffe-dev-db:
